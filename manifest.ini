name = whatsAppUnified
summary = "WhatsApp Unified Accessibility"
description = """Acessibilidade unificada para o WhatsApp Desktop e o WhatsApp Web: atalhos para lista de conversas, mensagens e campo de digitação, ações por mensagem (tocar áudio, copiar, ler completa, reagir, menu), filtros de fala, modo foco estável no Web sem som de troca de modo e recuperação do foco quando o WhatsApp o perde.
Baseado em whatsAppEnhancer (mrido1) e whatsAppNG (Nuno Costa); ideias do WhatsApp Desktop Access (Eyalson) e do WhatsApp Web Plus (muhammadGagah).
"""
